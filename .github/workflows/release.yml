name: Release

# Pose d'un tag vX.Y.Z : compilation, tests, préparation des paquets et publication de la release GitHub
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

# Un même tag ne se publie qu'une fois à la fois (l'événement peut être reçu en double)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cohérence tag / version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ("v$version" -ne '${{ github.ref_name }}') {
            throw "Le tag ${{ github.ref_name }} ne correspond pas à la version $version de Directory.Build.props."
          }

      - name: Compilation
        run: dotnet build GSB.CR.slnx --configuration Release

      - name: Tests unitaires (hors intégration Oracle)
        run: dotnet test GSB.CR.slnx --configuration Release --no-build --filter "TestCategory!=Integration"

      - name: Préparation de la livraison
        shell: pwsh
        run: ./scripts/preparer-livraison.ps1

      - name: Publication de la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $dossier = "publication/livraison-$($tag.TrimStart('v'))"
          $fichiers = Get-ChildItem $dossier -File | Where-Object Name -ne 'NOTES.md' | ForEach-Object FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # Release déjà publiée pour ce tag : on remplace les fichiers et les notes
            gh release upload $tag @fichiers --clobber
            gh release edit $tag --notes-file "$dossier/NOTES.md"
          } else {
            gh release create $tag @fichiers --title "GSB-CR $($tag.TrimStart('v'))" --notes-file "$dossier/NOTES.md" --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
